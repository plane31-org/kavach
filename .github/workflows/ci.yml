name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vectors
        run: |
          if [ -f spec/vectors.json ]; then scripts/vectors.sh; else echo "fixture not yet committed; skipping checker"; fi
