name: publish
# Publishes @plane31/blind-relay and @plane31/blind-relay-expo to npm when a version tag is pushed
# (v0.1.3 for package version 0.1.3), through npm trusted publishing: each package names this
# repository and this workflow file as its trusted publisher, and npm exchanges the run's GitHub
# identity (the id-token permission below) for a short-lived publish token. No npm token is stored,
# and provenance is attached automatically. Nothing publishes from a laptop.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: the tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          core=$(node -p "require('./packages/core/package.json').version")
          expo=$(node -p "require('./packages/expo/package.json').version")
          test "v$core" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match core $core"; exit 1; }
          test "$core" = "$expo" || { echo "core $core and expo $expo differ"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vectors
        run: scripts/vectors.sh
      - run: pnpm --filter "./packages/*" build
      - name: packed-package smoke test
        run: scripts/smoke.sh
      # Trusted publishing needs npm 11.5.1 or later; the runner's Node 22 ships npm 10.
      - run: npm install -g npm@11
      # pnpm packs (it rewrites the Expo package's workspace dependency to the real version, as the
      # smoke test checked); npm publishes, since npm is the client that performs the identity
      # exchange. Core first: the Expo package depends on it at exactly the same version.
      - name: publish
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          (cd packages/core && pnpm pack --pack-destination "$out")
          (cd packages/expo && pnpm pack --pack-destination "$out")
          npm publish "$out"/plane31-blind-relay-[0-9]*.tgz --access public
          npm publish "$out"/plane31-blind-relay-expo-[0-9]*.tgz --access public
